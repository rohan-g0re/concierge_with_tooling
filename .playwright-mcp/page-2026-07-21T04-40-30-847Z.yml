      - heading "[Python] FastAPI Using Server-Sent Events (SSE) for Streaming Responses" [level=1] [ref=f38e62]
    - main [ref=f38e63]:
      - article [ref=f38e66]:
        - generic [ref=f38e67]:
          - paragraph [ref=f38e68]:
            - text: Last Updated on 2024-11-02 by
            - link "Clay" [ref=f38e69] [cursor=pointer]:
              - /url: https://clay-atlas.com
          - paragraph [ref=f38e70]: I have recently set up numerous backend API servers for Chatbots. Initially, I received user messages and returned the entire LLM-generated reply in one go to the frontend interface. However, this approach did not provide a good user experience. I then switched to HTTP streaming, sending each generated token to the frontend as it was produced. Later, I found that some users’ devices experienced packet sticking, so I finally switched to using WebSocket.
          - paragraph [ref=f38e71]: Recently, my frontend colleagues and I discussed that using Server-Sent Events (SSE) might be a better option. As a result, I started exploring how to build an SSE API using FastAPI.
          - paragraph [ref=f38e72]: A quick overview shows that SSE is also based on HTTP and can be considered a lightweight alternative to WebSocket.
          - paragraph [ref=f38e73]: "First, install the following package:"
          - code [ref=f38e75]: pip install sse-starlette
          - paragraph [ref=f38e76]: "Next, you can perform a simple test:"
          - generic "app.py" [ref=f38e77]:
            - code [ref=f38e79]:
              - text: "import asyncio from fastapi import FastAPI from sse_starlette.sse import EventSourceResponse app = FastAPI() async def event_generator(sent: str): for char in sent: yield {\"event\": \"message\", \"data\": char} await asyncio.sleep(0.2)"
              - generic [ref=f38e80]: "@app.get"
              - text: "(\"/api/chatbot/stream\") async def sse_endpoint(sent: str): return EventSourceResponse(event_generator(sent))"
          - paragraph [ref=f38e81]
          - paragraph [ref=f38e82]: "This is a classic repetitive sentence response bot, used here to test the replacement effect of LLM. You can start it using the following command:"
          - code [ref=f38e84]: uvicorn app:app --port 8080 --reload
          - paragraph [ref=f38e85]
          - paragraph [ref=f38e86]
          - paragraph [ref=f38e87]: "Once we make the following request:"
          - generic "app.py" [ref=f38e88]:
            - code [ref=f38e90]: "import httpx url = \"http://127.0.0.1:8080/api/chatbot/stream\" params = {\"sent\": \"你好，今天天氣不錯～\"} with httpx.stream(\"GET\", url, params=params) as response: for line in response.iter_text(): if line: print(line)"
          - paragraph [ref=f38e91]: "Output:"
          - generic [ref=f38e92]: "event: messagedata: 你event: messagedata: 好event: messagedata: ，event: messagedata: 今event: messagedata: 天event: messagedata: 天event: messagedata: 氣event: messagedata: 不event: messagedata: 錯event: messagedata: ～"
