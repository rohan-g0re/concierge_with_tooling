          - generic [ref=f37e217]:
            - paragraph [ref=f37e218]: During my recent internship, I faced a task where the server needed to run a long-running process. This couldn't be done with just a POST request because the task could take up to 15 minutes to complete. So, we needed an alternative for this use case. And yes, you guessed it right, the solution is server-sent events.
            - heading [level=3] [ref=f37e219]:
              - generic [ref=f37e220]:
                - 'link "Link to section: What exactly is the server-sent event?" [ref=f37e221] [cursor=pointer]':
                  - /url: "#what-exactly-is-the-server-sent-event"
                  - text: "#"
                - text: What exactly is the server-sent event?
            - paragraph [ref=f37e222]: It is a standard allowing servers to push updates to the client over a single HTTP connection. This is useful for tasks that take a long time to complete, as it keeps the client informed about the progress without needing to constantly poll the server.
            - paragraph [ref=f37e223]: SSEs (Server-Sent Events) are essentially a subset of a WebSocket connection. While WebSockets provide a two-way communication channel, SSEs offer a one-way connection from the server to the client. This allows the server to send updates to the client without the client needing to request them repeatedly.
            - paragraph [ref=f37e224]: Since the client of our app doesn't need to push any updates to the server for this task, it fits well with the use case.
            - paragraph [ref=f37e225]:
              - img "Server-Sent Events diagram showing client-server communication" [ref=f37e226] [cursor=pointer]
            - heading [level=3] [ref=f37e227]:
              - generic [ref=f37e228]:
                - 'link "Link to section: Use Cases for a Server-Sent Events (SSE) Server" [ref=f37e229] [cursor=pointer]':
                  - /url: "#use-cases-for-a-server-sent-events-sse-server"
                  - text: "#"
                - text: Use Cases for a Server-Sent Events (SSE) Server
            - paragraph [ref=f37e230]: Server-Sent Events (SSE) provide a way for servers to push real-time updates to clients over a single HTTP connection. This is particularly useful for applications that require live data updates without the need for constant polling.
            - list [ref=f37e231]:
              - listitem [ref=f37e232]:
                - strong [ref=f37e233]: Real-Time Notifications
                - text: ": SSE is perfect for sending instant notifications to users, such as updates on social media platforms, email alerts, or system notifications in web applications."
              - listitem [ref=f37e234]:
                - strong [ref=f37e235]: Live Sports Scores
                - text: ": Applications that provide live sports updates can use SSE to push real-time scores and game updates to users, ensuring they receive the latest information without delay."
              - listitem [ref=f37e236]:
                - strong [ref=f37e237]: Stock Market Updates
                - text: ": Financial applications can leverage SSE to deliver real-time stock market data, keeping users informed about the latest market trends and changes as they happen."
